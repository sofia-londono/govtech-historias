<!doctype html>
<html lang=es><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name=robots content=noindex><meta name=theme-color content=#000000>
<title>Historias GovTech</title>
<link rel=preconnect href=https://fonts.googleapis.com><link rel=stylesheet href='https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Raleway:wght@500;600;700&display=swap'>
<style>
:root{color-scheme:dark;--bg:#000;--card:#111315;--card2:#1e2125;--line:#2d3136;--txt:#fff;--mut:#a4abb3;--blue:#3ba9f0;--on:#04202f;--red:#ff7a6b;--ok:#5fd38d;--amb:#ffc95c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 Raleway,system-ui,sans-serif;font-weight:500;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:14px 16px}h1{font:800 26px/1.15 Inter,sans-serif;letter-spacing:-.02em;margin:6px 0 4px}h2{font:700 16px Inter,sans-serif;margin:20px 0 8px}p{margin:6px 0}.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12.5px}
#top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#000e;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font:600 13px Inter,sans-serif}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:7px}.dot.on{background:var(--ok)}.dot.off{background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;transition:transform .12s}button:active{transform:scale(.97)}
.btn{width:100%;min-height:50px;border:0;border-radius:12px;background:var(--blue);color:var(--on);font:700 16px Inter,sans-serif;padding:12px}.btn[disabled]{opacity:.4}.btn.alt{background:var(--card2);color:var(--txt)}
textarea,.field{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;resize:vertical}textarea:focus,.field:focus{outline:2px solid var(--blue);border-color:transparent}
.drop{display:block;text-align:center;border:2px dashed var(--line);border-radius:14px;padding:22px 12px;font:700 16px Inter,sans-serif;cursor:pointer}.drop input{display:none}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}.thumb{flex:0 0 74px;position:relative}.thumb img,.thumb video{width:74px;height:110px;object-fit:cover;border-radius:9px;background:var(--card2);display:block}.thumb button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:#000c;color:#fff;font-size:14px;line-height:1}.thumb b{position:absolute;left:5px;bottom:4px;font:700 12px Inter;text-shadow:0 1px 3px #000}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{min-height:42px;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);font:600 14px Inter,sans-serif}.chip.on{background:var(--blue);border-color:var(--blue);color:var(--on)}
.fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}.fmt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 6px;font:600 12.5px/1.2 Inter,sans-serif;text-align:center;min-height:118px}.fmt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.fmt svg{display:block;margin:0 auto 6px;height:62px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:#000f;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}nav button{flex:1;min-height:46px;border:0;border-radius:10px;background:none;color:var(--mut);font:600 13px Inter,sans-serif;position:relative}nav button.on{background:var(--blue);color:var(--on)}.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#000;font-size:11px;margin-left:5px}
.bar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
.st{display:inline-block;border-radius:99px;padding:2px 10px;font:700 12px Inter,sans-serif;background:var(--card2);color:var(--mut)}.st.lista{background:var(--blue);color:var(--on)}.st.error{background:#3a1d1a;color:var(--red)}.st.publicada{color:var(--ok)}
.opt{display:flex;gap:6px;margin:6px 0}.copy{flex:1;text-align:left;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card2);font:600 15px/1.35 Raleway,sans-serif}.copy.ok{border-color:var(--ok)}.mk{flex:none;min-height:46px;padding:0 12px;border:0;border-radius:11px;background:var(--blue);color:var(--on);font:700 13px Inter,sans-serif}.mk[disabled]{opacity:.4}
video.pv{width:100%;max-height:70vh;aspect-ratio:9/20;background:#000;border-radius:12px;display:block;margin:9px 0}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.hide{display:none!important}
.work:before{content:'';display:inline-block;width:11px;height:11px;border:2px solid var(--blue);border-right-color:transparent;border-radius:50%;margin-right:7px;vertical-align:-1px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));z-index:9;transform:translate(-50%,10px);width:max-content;max-width:calc(100% - 32px);padding:10px 15px;border-radius:99px;background:#fff;color:#000;font:600 14px Inter,sans-serif;opacity:0;transition:.2s;pointer-events:none}#toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<div id=top><span id=conn><i class=dot></i>Conectando…</span><a href=https://govtech-guia-grabacion.vercel.app class=mut style='text-decoration:none'>Abrir guía</a></div>
<main>
<section id=login class=hide><h1>Historias GovTech</h1><p class=mut>Escribe tu PIN.</p><input id=pin class=field inputmode=numeric autocomplete=off maxlength=6><p></p><button class=btn id=enter>Entrar</button><p id=loginErr class=sm style='color:var(--red)'></p></section>
<section id=nueva class=hide></section><section id=lista class=hide></section><section id=falta class=hide></section>
</main><nav id=nav class=hide></nav><div id=toast role=status></div>
<script src=app.js></script></body></html>
